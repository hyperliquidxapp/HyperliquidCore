name: Swift tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_build_toolchain.py'
      - run: python3 scripts/build-toolchain.py swift test --force-resolved-versions
